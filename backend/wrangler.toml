name = "ticketmaestro-api"
main = "src/worker.js"
compatibility_date = "2026-02-01"
compatibility_flags = ["nodejs_compat"]
preview_urls = false

[vars]
CLIENT_ORIGIN = "http://localhost:8788"
AI_MODEL = "@cf/cloudflare/clef-flash"

[[d1_databases]]
binding = "DB"
database_name = "ticketmaestro"
database_id = "00000000-0000-0000-0000-000000000000"

[ai]
binding = "AI"

[[ratelimits]]
name = "AUTH_LIMIT"
namespace_id = "1001"
simple = { limit = 12, period = 60 }

[[ratelimits]]
name = "TICKET_LIMIT"
namespace_id = "1002"
simple = { limit = 8, period = 60 }

[build]
command = "node scripts/prepare-docs.js"

[assets]
directory = "./.wrangler/doc-assets"
